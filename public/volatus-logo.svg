<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%" fill="none">
  <!-- 
    Volatus Capital Logo (faithfully modeled after icon.jpeg with 100% transparent background)
  -->
  <defs>
    <!-- Brand Royal Purple Gradient -->
    <linearGradient id="volatusPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="35%" stop-color="#7E22CE" />
      <stop offset="70%" stop-color="#58145E" />
      <stop offset="100%" stop-color="#3E0B42" />
    </linearGradient>

    <!-- Brand Gold Lightning Gradient -->
    <linearGradient id="volatusGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D98A1B" />
      <stop offset="45%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#FFD043" />
    </linearGradient>

    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F5A623" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9333EA" flood-opacity="0.25" />
    </filter>
  </defs>

  <g id="emblem" filter="url(#goldGlow)">
    <!-- Left Wing (Deep Purple Slanted Bar with Rounded Top-Left) -->
    <path 
      d="M 236 386 L 104 104 C 100 95, 107 86, 118 86 L 190 86 L 248 226 L 204 316 Z" 
      fill="url(#volatusPurple)" 
    />
    
    <!-- Right Wing (Golden Lightning Bolt with Upward Arrow) -->
    <path 
      d="M 236 386 L 204 316 L 294 176 L 262 186 L 312 92 L 370 120 L 352 134 L 446 22 L 394 158 L 376 138 L 326 230 L 352 230 Z" 
      fill="url(#volatusGold)" 
    />
  </g>

  <!-- Typography matching icon.jpeg -->
  <g id="brand-text" text-anchor="middle">
    <!-- VOLATUS -->
    <text 
      x="270" 
      y="435" 
      fill="#F3E8FF" 
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
      font-size="44" 
      font-weight="900" 
      letter-spacing="10"
    >VOLATUS</text>

    <!-- Flanking Gold Lines & CAPITAL -->
    <line x1="56" y1="468" x2="168" y2="468" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" />
    <text 
      x="270" 
      y="474" 
      fill="#F5A623" 
      font-family="'Newsreader', Georgia, serif" 
      font-size="23" 
      font-weight="800" 
      letter-spacing="10"
    >CAPITAL</text>
    <line x1="372" y1="468" x2="484" y2="468" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
